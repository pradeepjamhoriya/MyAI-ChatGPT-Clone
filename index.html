    <script>
      // Ensure window.fetch is writable and configurable for browser extensions and test executors
      try {
        if (typeof window !== 'undefined' && window.fetch) {
          let _activeFetch = window.fetch.bind(window);
          Object.defineProperty(window, 'fetch', {
            get() {
              return _activeFetch;
            },
            set(newFetch) {
              _activeFetch = newFetch;
            },
            configurable: true,
            enumerable: true,
          });
        }
      } catch (e) {
        // Fallback silently if not allowed
      }
    </script>
